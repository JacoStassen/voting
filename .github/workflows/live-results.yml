name: Live results relay

# Copies the IEC's 2026 local-election results to the `live-data` branch (live.json),
# which the site reads via raw.githubusercontent.com (the IEC feed blocks cross-site reads).
#
# The results are in and only a few wards are still contested, so each run now does a
# single fetch and the schedule fires a few times a day. If every ward is declared the
# workflow disables itself. To go back to near-live updates, set LOOP_MINUTES to 25,
# use cron "*/5 * * * *" and restore the self-chaining `next` job (see git history).
on:
  schedule:
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      final: ${{ steps.loop.outputs.final }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and publish once
        id: loop
        env:
          LOOP_MINUTES: "0"
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="$RUNNER_TEMP/live.json"
          WARDS="$RUNNER_TEMP/wards"
          RAW="$RUNNER_TEMP/raw"
          PROJ="$RUNNER_TEMP/projections.json"
          mkdir -p "$WARDS"
          # Start from the last published copy so a failed province keeps its data,
          # and councils not refetched this run keep their ward files.
          if git fetch -q origin live-data 2>/dev/null; then
            git show FETCH_HEAD:live.json > "$OUT"; first=false
            git archive FETCH_HEAD wards 2>/dev/null | tar -x -C "$RUNNER_TEMP" || true
            git show FETCH_HEAD:projections.json > "$PROJ" 2>/dev/null || rm -f "$PROJ"
          else cp results/live.json "$OUT"; first=true; fi

          publish() {
            # live.json, projections.json and wards/<council>.json, as one commit with no parent
            tree=$( { printf '100644 blob %s\tlive.json\n' "$(git hash-object -w "$OUT")"
                      [ -s "$PROJ" ] && printf '100644 blob %s\tprojections.json\n' "$(git hash-object -w "$PROJ")"
                      [ -n "$(ls -A "$WARDS")" ] && printf '040000 tree %s\twards\n' "$(for f in "$WARDS"/*.json; do printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"; done | git mktree)"
                    } | git mktree)
            commit=$(git commit-tree "$tree" -m "Live results $(date -u +%FT%TZ)")
            git push -q -f origin "$commit:refs/heads/live-data"
            echo "published $(date -u +%T)"
          }
          # Also keep results/live.json on master current (the page's fallback copy).
          # Each master commit triggers a Pages build, so do this at most every 5 minutes.
          last_master=-1000
          to_master() {
            [ $((SECONDS - last_master)) -lt 300 ] && return 0
            cp "$OUT" results/live.json
            git diff --quiet -- results/live.json && return 0
            git add results/live.json
            git commit -q -m "Update live results"
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && echo "master updated $(date -u +%T)"
            last_master=$SECONDS
          }
          is_final() {
            python3 -c "import json,sys;p=json.load(open('$OUT'))['prog'];sys.exit(0 if p['munis'][1] and p['munis'][0]>=p['munis'][1] and p['vd'][0]>=p['vd'][1] else 1)"
          }

          # Projection model (scripts/project.py): rerun at most every 5 minutes, using the
          # metro files fetch_results.py just saved. A failure never stops the relay.
          last_proj=-1000
          project() {
            [ $((SECONDS - last_proj)) -lt 300 ] && return 1
            last_proj=$SECONDS
            timeout 240 python3 scripts/project.py --live "$OUT" --raw-dir "$RAW" --out "$PROJ.new" && mv "$PROJ.new" "$PROJ"
          }

          end=$((SECONDS + LOOP_MINUTES * 60))
          final=false
          while :; do
            started=$SECONDS
            changed=false
            python3 scripts/fetch_results.py --out "$OUT" --wards-dir "$WARDS" --raw-dir "$RAW" | tee /dev/stderr | grep -q '^wrote' && changed=true
            project && changed=true || true
            if [ "$changed" = true ] || [ "$first" = true ]; then publish; first=false; fi
            to_master || echo "warn: master update failed"
            if is_final; then final=true; echo "Counting complete"; break; fi
            [ $SECONDS -ge $end ] && break
            sleep $(( 60 - (SECONDS - started) > 5 ? 60 - (SECONDS - started) : 5 ))
          done
          echo "final=$final" >> "$GITHUB_OUTPUT"

  stop-when-final:
    needs: fetch
    if: needs.fetch.outputs.final == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Counting complete; disable the relay
        run: gh workflow disable live-results.yml --repo "$GITHUB_REPOSITORY"
